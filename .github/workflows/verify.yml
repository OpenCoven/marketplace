name: Verify marketplace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/sync-marketplace.py --check
      - run: node scripts/sync-marketplace.test.mjs
      - run: node scripts/crafts-audited-content.test.mjs
      - run: node scripts/package-payloads.mjs
      - run: node scripts/package-payloads.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-payloads
          path: dist/
